      function runAiCostEngine(categoryId, description, urgency, customRates) {
        const cat = CATEGORIES.find(c => c.id === categoryId) || CATEGORIES[6];
        const rates = (customRates && customRates[categoryId]) || { material: cat.baseMaterial, labor: cat.baseLabor };
        const text = (description || '').toLowerCase();

        let mult = 1.0;
        const notes = [];

        if (urgency === 'acil') { mult *= 1.2; notes.push('Acil müdahale (+%20)'); }
        if (urgency === 'cok_acil') { mult *= 1.4; notes.push('7/24 Çok acil müdahale (+%40)'); }

        const highCostKeywords = ['pano', 'ana hat', 'kompresör', 'davlumbaz', 'kırıl', 'değişim', 'motor', 'nvr', 'kayıt', 'amfi', 'fayans', 'zemin', 'su kaçağı', 'pompa'];
        const lowCostKeywords = ['priz', 'ampul', 'conta', 'musluk', 'ayar', 'temizlik', 'kablo ucu', 'soket'];

        let matchedHigh = highCostKeywords.filter(k => text.includes(k));
        let matchedLow = lowCostKeywords.filter(k => text.includes(k));

        if (matchedHigh.length > 0) {
          mult *= (1 + Math.min(0.6, matchedHigh.length * 0.22));
          notes.push('Kapsamlı parça/işçilik tespit edildi: ' + matchedHigh.join(', '));
        } else if (matchedLow.length > 0) {
          mult *= 0.72;
          notes.push('Standart lokal müdahale: ' + matchedLow.join(', '));
        } else {
          notes.push('Kategori bazlı standart keşif tahmini');
        }

        const estMaterial = Math.round((rates.material * mult) / 50) * 50;
        const estLabor = Math.round((rates.labor * mult) / 50) * 50;
        const estTotal = estMaterial + estLabor;
        const suggestedMin = Math.round((estTotal * 1.15) / 100) * 100;
        const suggestedMax = Math.round((estTotal * 1.35) / 100) * 100;

        return {
          estMaterial,
          estLabor,
          estCost: estTotal,
          suggestedMin,
          suggestedMax,
          suggestedQuote: Math.round(((suggestedMin + suggestedMax) / 2) / 100) * 100,
          estDuration: cat.hours,
          confidence: matchedHigh.length || matchedLow.length ? '%89 Güven' : '%78 Güven',
          reasoning: notes.join(' • ')
        };
      }

      function playAlertBeep() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          const ctx = new Ctx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.18);
        } catch (e) {}
      }

      function flushOutbox(client) {
        if (!pendingOutbox.length) return;
        const remaining = [];
        for (const item of pendingOutbox) {
          let delivered = false;
          const targets = client ? [client] : mqttClients;
          targets.forEach(c => {
            if (c && c.connected) {
              try {
                c.publish(item.topic, item.payload, { qos: 0, retain: item.retain !== false });
                delivered = true;
              } catch (e) {}
            }
          });
          if (!delivered) remaining.push(item);
        }
        pendingOutbox = remaining;
      }

          'wss://test.mosquitto.org:8081/mqtt'

                  if (!db.deletedIds) db.deletedIds = [];

                } else if (payload.t === 'CLIENT_UPSERT' && payload.client) {

      }

      // Union-merge chat messages by msgId so simultaneous customer + admin messages NEVER overwrite each other!
      function unionMergeMessages(localMsgs, remoteMsgs, deletedMsgIds) {
        const delSet = new Set(deletedMsgIds || []);
        const map = new Map();
        (localMsgs || []).forEach(m => {
          const key = m.msgId || `${m.sender}_${m.time}_${m.text}`;
          if (!delSet.has(key)) map.set(key, Object.assign({ msgId: key }, m));
        });
        (remoteMsgs || []).forEach(m => {
          const key = m.msgId || `${m.sender}_${m.time}_${m.text}`;
          if (!delSet.has(key)) {
            const prev = map.get(key);
            map.set(key, prev ? Object.assign({}, prev, m) : Object.assign({ msgId: key }, m));
          }
        });
        return Array.from(map.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      }

      function mergeSingleTicket(rt) {
        if (!rt || !rt.id) return false;
        if ((db.deletedIds || []).includes(rt.id)) return false;
        const existing = db.tickets.find(x => x.id === rt.id);
        if (!existing) {
          const reconstructedMedia = rt.thumbUrl ? [{ name: 'foto.jpg', type: 'image', dataUrl: rt.thumbUrl, thumbUrl: rt.thumbUrl }] : [];
          db.tickets.unshift(Object.assign({}, rt, { media: reconstructedMedia }));
          db.tickets.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
          return true;
        }

        const mergedDeletedMsgs = Array.from(new Set([...(existing.deletedMsgIds || []), ...(rt.deletedMsgIds || [])]));
        const mergedMessages = unionMergeMessages(existing.messages, rt.messages, mergedDeletedMsgs);
        const msgChanged = JSON.stringify(mergedMessages) !== JSON.stringify(existing.messages || []);

        const isRemoteNewer = (rt.updatedAt || 0) >= (existing.updatedAt || 0);
        let fieldsChanged = false;

        if (isRemoteNewer) {
          if (
            rt.status !== existing.status ||
            rt.description !== existing.description ||
            rt.category !== existing.category ||
            rt.urgency !== existing.urgency ||
            JSON.stringify(rt.quote || null) !== JSON.stringify(existing.quote || null) ||
            JSON.stringify(rt.invoice || null) !== JSON.stringify(existing.invoice || null) ||
            rt.completionNote !== existing.completionNote ||
            rt.deliveryRating !== existing.deliveryRating
          ) {
            existing.updatedAt = Math.max(existing.updatedAt || 0, rt.updatedAt || Date.now());
            existing.category = rt.category;
            existing.urgency = rt.urgency;
            existing.description = rt.description;
            existing.status = rt.status;
            existing.aiEstimate = rt.aiEstimate || existing.aiEstimate;
            existing.quote = rt.quote;
            existing.assignedStaff = rt.assignedStaff;
            existing.completionNote = rt.completionNote;
            existing.deliveryRating = rt.deliveryRating;
            existing.deliveryComment = rt.deliveryComment;
            existing.invoice = rt.invoice ? Object.assign({}, existing.invoice || {}, rt.invoice) : null;
            fieldsChanged = true;
          }
        }

        if ((!existing.media || existing.media.length === 0) && rt.thumbUrl) {
          existing.media = [{ name: 'foto.jpg', type: 'image', dataUrl: rt.thumbUrl, thumbUrl: rt.thumbUrl }];
          fieldsChanged = true;
        }

        if (msgChanged) {
          existing.messages = mergedMessages;
          existing.deletedMsgIds = mergedDeletedMsgs;
        }

        return msgChanged || fieldsChanged;
      }

      function publishWirePayload(subtopic, obj, retain = true) {
        obj.senderDev = window._syDeviceId;
        const str = JSON.stringify(obj);
        const fullTopic = `${MQTT_BASE}/${subtopic}`;
        let sentMqtt = false;
        mqttClients.forEach(c => {
          if (c && c.connected) {
            try {
              c.publish(fullTopic, str, { qos: 0, retain });
              sentMqtt = true;
            } catch (e) {}
          }
        });
        if (!sentMqtt) {
          pendingOutbox.push({ topic: fullTopic, payload: str, retain });
        }
        if (!db.cloudDbUrl && str.length < 3950) {
          try {
            fetch(`https://ntfy.sh/${DEFAULT_RELAY_ROOM}`, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: str
            }).catch(() => {});
          } catch (e) {}
        }
      }

        if (!t || !t.id) return;
        let pkt = { t: 'TICKET_UPSERT', ticket: slimTicketForWire(t, true) };

          pkt = { t: 'TICKET_UPSERT', ticket: slimTicketForWire(t, false) };
        }
        publishWirePayload(`ticket/${t.id}`, pkt, true);
      }

      function publishClientPacket(cl) {

      function isAppsScriptUrl(url) {
        return (url || '').includes('script.google.com');
      }

      async function syncToCloud(changedTicketId = null, changedClientId = null) {
        // Delta-only publish! Only transmit the exact ticket or client that changed so devices NEVER overwrite other tickets!
        if (changedTicketId) {
          const t = db.tickets.find(x => x.id === changedTicketId);
          if (t) publishTicketPacket(t);
        }
        if (changedClientId) {
          const cl = db.clients.find(x => x.id === changedClientId);
          if (cl) publishClientPacket(cl);
        }

        try {
          if (db.cloudDbUrl) {
            if (isAppsScriptUrl(db.cloudDbUrl)) {
              await fetch(db.cloudDbUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(db)
              });
            } else {
              const url = `${db.cloudDbUrl}/solve_yapi_db.json`;
              await fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(db)
              });
            }
            updateSyncPill('● Özel Bulut Bağlı', 'emerald');
            return;
          }
          updateSyncPill(getConnectedBrokerCount() > 0 ? `● Canlı Bağlı (${getConnectedBrokerCount()} Kanal)` : '● Canlı Bağlantı Aktif', 'emerald');
        } catch (e) {
          updateSyncPill('● Bağlantı Bekleniyor', 'amber');
        }
      }

      async function pullFromCloud() {
        try {
          if (db.cloudDbUrl) {
            const url = isAppsScriptUrl(db.cloudDbUrl)
              ? `${db.cloudDbUrl}?t=${Date.now()}`
              : `${db.cloudDbUrl}/solve_yapi_db.json`;
            const res = await fetch(url);
            if (!res.ok) return false;
            const remote = await res.json();
            if (remote && remote.updatedAt && remote.updatedAt > (db.updatedAt || 0)) {
              db = Object.assign(createInitialSharedDb(), remote);
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
              smartRefreshUI();
            }
            updateSyncPill('● Özel Bulut Bağlı', 'emerald');
            return true;
          }
          const res = await fetch(`https://ntfy.sh/${DEFAULT_RELAY_ROOM}/json?poll=1&since=24h&t=${Date.now()}`);
          if (!res.ok) return false;
          const text = await res.text();
          const lines = text.trim().split('\n').filter(Boolean);
          let anyChanged = false;
          for (const line of lines) {
            try {
              const evt = JSON.parse(line);
              if (evt && evt.event === 'message' && evt.message) {
                const payload = JSON.parse(evt.message);
                if (!payload) continue;
                if (payload.t === 'TICKET_UPSERT' && payload.ticket) {
                  if (mergeSingleTicket(payload.ticket)) anyChanged = true;
                } else if (payload.t === 'TICKET_DELETE' && payload.id) {
                  if (!db.deletedIds) db.deletedIds = [];
                  if (!db.deletedIds.includes(payload.id)) db.deletedIds.push(payload.id);
                  const before = db.tickets.length;
                  db.tickets = db.tickets.filter(x => x.id !== payload.id);
                  if (db.tickets.length !== before) anyChanged = true;
                } else if (payload.t === 'CLIENT_UPSERT' && payload.client) {
                  const idx = db.clients.findIndex(c => c.id === payload.client.id);
                  if (idx >= 0) db.clients[idx] = Object.assign({}, db.clients[idx], payload.client);
                  else { db.clients.push(payload.client); anyChanged = true; }
                } else if (payload.t === 'CLIENT_DELETE' && payload.id) {
                  const bLen = db.clients.length;
                  db.clients = db.clients.filter(c => c.id !== payload.id);
                  if (db.clients.length !== bLen) anyChanged = true;
                }
              }
            } catch (err) {}
          }
          if (anyChanged) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
            smartRefreshUI();
          }
          return true;
        } catch (e) {
          return false;
        }
      }

        return digits || '905535988201';

      function compressMediaFile(file, callback) {
        if (!file) return;
        if (file.type.startsWith('video')) {
          if (file.size > 2500000) {
            showToast('Video boyutu 2.5 MB üzerinde olduğu için önizleme olarak eklendi.', 'info');
          }
          const reader = new FileReader();
          reader.onload = (ev) => callback({ name: file.name, type: 'video', dataUrl: ev.target.result });
          reader.readAsDataURL(file);
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const maxW = 720;
            let w = img.width || 600;
            let h = img.height || 450;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const compressed = canvas.toDataURL('image/jpeg', 0.65);
            // Also create a micro-thumbnail (96px, low quality ~900 bytes) for zero-config instant relay across phones
            const tCanvas = document.createElement('canvas');
            const tw = 96;
            const th = Math.max(64, Math.round((h * tw) / w));
            tCanvas.width = tw;
            tCanvas.height = th;
            tCanvas.getContext('2d').drawImage(img, 0, 0, tw, th);
            const thumbUrl = tCanvas.toDataURL('image/jpeg', 0.35);
            callback({ name: file.name, type: 'image', dataUrl: compressed, thumbUrl: thumbUrl.length < 1800 ? thumbUrl : null });
          };
          img.onerror = () => callback({ name: file.name, type: 'image', dataUrl: ev.target.result });
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

        el.textContent = msg;

      function sendChatMessage(ticketId, role) {
        const input = document.getElementById(`chat-input-${role}-${ticketId}`);
        const text = (input && input.value || '').trim();
        if (!text) {
          showToast('Lütfen bir mesaj yazın.', 'warning');
          return;
        }
        const t = db.tickets.find(x => x.id === ticketId);
        if (!t) return;
        if (!t.messages) t.messages = [];

        const client = db.clients.find(c => c.id === t.clientId);
        // Mark incoming messages as read when replying
        t.messages.forEach(m => {
          if (role === 'admin') m.readByAdmin = true;
          else m.readByCustomer = true;
        });

        t.messages.push({
          msgId: 'm_' + Date.now() + '_' + Math.random().toString(16).slice(2, 6),
          ts: Date.now(),
          sender: role,
          senderName: role === 'admin' ? 'Solve Yapı (Tolga Kaya)' : (client ? client.name : 'Müşteri'),
          text,
          time: getNowStr(),
          readByAdmin: role === 'admin',
          readByCustomer: role === 'customer'
        });

        if (role === 'admin') {
          db.notifications.unshift({
            id: 'n-' + Date.now(),
            clientId: t.clientId,
            text: `${t.id} nolu talebe Solve Yapı'dan mesaj: "${text}"`,
            time: getNowStr(),
            read: false
          });
        }

        saveDb(true, ticketId);
        renderAll();
        // Scroll chat boxes to bottom
        document.querySelectorAll('.chat-scroll-box').forEach(el => { el.scrollTop = el.scrollHeight; });
        showToast(role === 'customer' ? 'Mesajınız Solve Yapı yöneticisine iletildi.' : 'Mesajınız müşteriye iletildi.', 'success');
      }

      function bindScopedChatHandlers(rootEl) {
        rootEl.querySelectorAll('.send-chat-btn').forEach(btn => {
          btn.addEventListener('click', () => sendChatMessage(btn.dataset.chatTicket, btn.dataset.chatRole));
        });
        rootEl.querySelectorAll('.chat-msg-input').forEach(inp => {
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              sendChatMessage(inp.dataset.chatInputTicket, inp.dataset.chatInputRole);
            }
          });
        });
        rootEl.querySelectorAll('.del-chat-msg-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const ticketId = btn.dataset.delMsgTicket;
            const idx = Number(btn.dataset.delMsgIdx);
            const t = db.tickets.find(x => x.id === ticketId);
            if (!t || !t.messages) return;
            const removed = t.messages.splice(idx, 1)[0];
            if (removed) {
              const key = removed.msgId || `${removed.sender}_${removed.time}_${removed.text}`;
              t.deletedMsgIds = Array.from(new Set([...(t.deletedMsgIds || []), key]));
            }
            saveDb(true, ticketId);
            renderAll();
            showToast('Mesaj silindi.', 'info');
          });
        });
        rootEl.querySelectorAll('.chat-scroll-box').forEach(el => { el.scrollTop = el.scrollHeight; });
      }

                showToast('Kullanıcı adı veya şifre hatalı!', 'warning');
                return;
              }
              if (match.active === false) {
                showToast('Hesabınız yönetici tarafından askıya alınmış.', 'warning');
                return;
              }
              ui.activeClientId = match.id;
              ui.custTab = 'tickets';
              saveUi();
              renderCustomerApp();
              showToast(`Hoş geldiniz, ${match.name}`, 'success');
            });

              const phone = document.getElementById('reg-phone').value.trim();

              const taxNo = document.getElementById('reg-taxn').value.trim();

              const pass2 = document.getElementById('reg-pass2').value;

              if (!name || !username || !phone || !pass) {
                showToast('Lütfen zorunlu (*) alanları doldurun.', 'warning');
                return;
              }
              if (pass.length < 4 || pass !== pass2) {
                showToast('Şifreler eşleşmiyor veya 4 karakterden kısa.', 'warning');

                name,
                type,
                address: address || 'İstanbul',
                phone,
                taxOffice: taxOffice || 'İstanbul V.D.',

              saveUi();

            ${m.type === 'video'
              ? `<video src="${m.dataUrl}" class="w-full h-full object-cover"></video>`
              : `<img src="${m.dataUrl}" class="w-full h-full object-cover" alt="Ek" />`}
            <button data-remove-media="${idx}" class="remove-media-btn absolute top-0.5 right-0.5 w-5 h-5 rounded-full bg-rose-600 text-white text-[10px] font-bold flex items-center justify-center">×</button>

        container.querySelectorAll('.remove-media-btn').forEach(btn => {
          btn.addEventListener('click', () => {

            renderPendingMediaPreviews();
          });

      function attachCustomerTicketActions(rootEl) {
        rootEl.querySelectorAll('.cust-approve-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const t = db.tickets.find(x => x.id === btn.dataset.approveStart);
            if (!t) return;
            t.status = 'in_progress';
            saveDb(true, t.id);
            renderAll();
            showToast('Onayınız alındı! Operasyon başlatıldı.', 'success');
          });
        });

        rootEl.querySelectorAll('.cust-rev-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const t = db.tickets.find(x => x.id === btn.dataset.requestRev);
            if (!t) return;
            t.status = 'revision_requested';
            if (!t.messages) t.messages = [];
            const client = db.clients.find(c => c.id === t.clientId);
            t.messages.push({
              sender: 'customer',
              senderName: client ? client.name : 'Müşteri',
              text: 'Fiyat teklifi için revize talep ediyorum.',
              time: getNowStr(),
              readByAdmin: false,
              msgId: 'm_' + Date.now() + '_rev',
              ts: Date.now(),
              readByCustomer: true
            });
            saveDb(true, t.id);
            renderAll();
            showToast('Revize talebiniz yöneticiye iletildi.', 'info');
          });
        });

        rootEl.querySelectorAll('.cust-deliver-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.confirmDelivery;
            const t = db.tickets.find(x => x.id === id);
            if (!t) return;
            const ratingEl = document.getElementById(`deliver-rating-${id}`);
            const commentEl = document.getElementById(`deliver-comment-${id}`);

    if (rows.length > 0) tSheet.getRange(2, 1, rows.length, 7).setValues(rows);

              try {

                ta.select();
                document.execCommand('copy');

          document.getElementById('save-cloud-url-btn').addEventListener('click', async () => {

              await syncToCloud();
              const ok = await pullFromCloud();
              showToast(ok ? 'Bulut bağlantısı başarılı!' : 'URL kaydedildi ancak bağlantı doğrulanamadı.', ok ? 'success' : 'warning');

          document.getElementById('save-ai-rates-btn').addEventListener('click', () => {
            document.querySelectorAll('.rate-input').forEach(inp => {

              if (!db.customRates[cat]) {
                const def = CATEGORIES.find(c => c.id === cat);
                db.customRates[cat] = { material: def.baseMaterial, labor: def.baseLabor };
              }
              db.customRates[cat][type] = Math.max(0, Number(inp.value) || 0);
            });
            saveDb();
            showToast('AI birim maliyetleri güncellendi.', 'success');
          });

          const expBtn = document.getElementById('export-db-json-btn');
          if (expBtn) {
            expBtn.addEventListener('click', () => {
              const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = 'solve_yapi_yedek.json';
              document.body.appendChild(a);
              a.click();
              a.remove();
              showToast('Veritabanı yedeği indirildi.', 'success');
            });
          }
          const impInp = document.getElementById('import-db-json-input');
          if (impInp) {
            impInp.addEventListener('change', (e) => {
              const file = e.target.files && e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = (ev) => {
                try {
                  const parsed = JSON.parse(ev.target.result);
                  if (parsed && Array.isArray(parsed.tickets) && Array.isArray(parsed.clients)) {
                    db = Object.assign(createInitialSharedDb(), parsed);
                    saveDb();
                    renderAll();
                    showToast('Veritabanı yedeği başarıyla yüklendi!', 'success');
                  } else {
                    showToast('Geçersiz yedek dosyası.', 'warning');
                  }
                } catch (err) {
                  showToast('Dosya okunamadı.', 'warning');
                }
              };
              reader.readAsDataURL ? reader.readAsText(file) : null;
            });
          }
        }
      }

      function attachAdminTicketActions(rootEl) {
        rootEl.querySelectorAll('.admin-send-quote-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.sendQuote;
            const t = db.tickets.find(x => x.id === id);
            if (!t) return;
            const net = Number(document.getElementById(`quote-price-${id}`).value) || 0;
            const staff = document.getElementById(`quote-staff-${id}`).value;
            const note = document.getElementById(`quote-note-${id}`).value.trim();
            if (net <= 0) {
              showToast('Geçerli bir fiyat girin.', 'warning');
              return;
            }
            const total = Math.round(net * 1.2);
            t.quote = { netAmount: net, vatRate: 20, totalAmount: total, note, sentAt: getNowStr() };
            t.assignedStaff = staff;
            t.status = 'quoted';
            t.updatedAt = Date.now();

            const client = db.clients.find(c => c.id === t.clientId);
            db.notifications.unshift({
              id: 'n-' + Date.now(),
              clientId: t.clientId,
              text: `${client ? client.name : ''} için ${t.id} nolu talebe ${formatTL(total)} fiyat teklifi geldi.`,
              time: getNowStr(),
              read: false
            });

            saveDb();
            renderAll();
            publishTicketPacket(t);
            showToast('Fiyat teklifi müşteriye gönderildi!', 'success');
          });
        });

        rootEl.querySelectorAll('.comp-photo-input').forEach(inp => {
          inp.addEventListener('change', (e) => {
            const id = inp.dataset.compPhoto;
            const t = db.tickets.find(x => x.id === id);
            const file = e.target.files && e.target.files[0];
            if (!t || !file) return;
            compressMediaFile(file, (item) => {
              if (!t.completionMedia) t.completionMedia = [];
              t.completionMedia.push({ name: item.name, dataUrl: item.dataUrl });
              saveDb(true, t.id);
              renderAdminApp();
            });
          });
        });

        rootEl.querySelectorAll('.admin-finish-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.finishOp;
            const t = db.tickets.find(x => x.id === id);
            if (!t) return;
            const note = document.getElementById(`complete-note-${id}`).value.trim();
            t.completionNote = note || 'Teknik müdahale ve kalite kontrol testleri tamamlanmıştır.';
            t.status = 'completed_pending_delivery';
            t.updatedAt = Date.now();

            db.notifications.unshift({
              id: 'n-' + Date.now(),
              clientId: t.clientId,
              text: `${t.id} nolu talebin operasyonu tamamlandı. Teslim onayınız bekleniyor.`,
              time: getNowStr(),
              read: false
            });

            saveDb();
            renderAll();
            publishTicketPacket(t);
            showToast('Operasyon tamamlandı bildirimi müşteriye iletildi.', 'success');
          });
        });

        rootEl.querySelectorAll('.admin-invoice-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.issueInvoice;
            const t = db.tickets.find(x => x.id === id);
            if (!t || !t.quote) return;

            const invNo = 'SLV-2026-' + String(1001 + db.tickets.filter(x => x.invoice).length);
            t.invoice = {
              invoiceNo: invNo,
              issuedAt: getNowStr(),
              netAmount: t.quote.netAmount,
              vatAmount: t.quote.totalAmount - t.quote.netAmount,
              totalAmount: t.quote.totalAmount
            };
            t.status = 'invoiced';
            t.updatedAt = Date.now();

            db.notifications.unshift({
              id: 'n-' + Date.now(),
              clientId: t.clientId,
              text: `${t.id} nolu iş için ${invNo} nolu faturanız kesildi (${formatTL(t.invoice.totalAmount)}).`,
              time: getNowStr(),
              read: false
            });

            saveDb();
            renderAll();
            publishTicketPacket(t);
            openInvoiceModal(id);
            showToast('Fatura kesildi ve müşteriye iletildi!', 'success');
          });
        });

        rootEl.querySelectorAll('.view-invoice-btn').forEach(btn => {
          btn.addEventListener('click', () => openInvoiceModal(btn.dataset.viewInvoice));
        });

        rootEl.querySelectorAll('.admin-edit-ticket-btn').forEach(btn => {
          btn.addEventListener('click', () => openEditTicketModal(btn.dataset.adminEditTicket, 'admin'));
        });

        rootEl.querySelectorAll('.admin-del-ticket-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.adminDelTicket;
            db.deletedIds = Array.from(new Set([...(db.deletedIds || []), id]));
            broadcastTicketDelete(id);
            db.tickets = db.tickets.filter(x => x.id !== id);
            saveDb();
            renderAll();
            showToast('Talep tamamen silindi.', 'info');
          });
        });

        bindScopedChatHandlers(rootEl);
      }

      function openEditTicketModal(ticketId, role) {
        const t = db.tickets.find(x => x.id === ticketId);
        if (!t) return;
        const isAdmin = role === 'admin';

        openModal(`
          <div class="space-y-3">
            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
              <h3 class="text-sm font-extrabold text-slate-900">✏️ İş / Talep Düzenle (${t.id})</h3>
              <button id="edit-t-close" class="text-xs font-semibold text-slate-500">Kapat</button>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Kategori</label>
                <select id="edit-t-cat" class="w-full rounded-xl border border-slate-300 px-2.5 py-2 text-xs bg-white">
                  ${CATEGORIES.map(c => `<option value="${c.id}" ${t.category === c.id ? 'selected' : ''}>${c.icon} ${c.name}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Aciliyet</label>
                <select id="edit-t-urg" class="w-full rounded-xl border border-slate-300 px-2.5 py-2 text-xs bg-white">
                  <option value="normal" ${t.urgency === 'normal' ? 'selected' : ''}>Normal</option>
                  <option value="acil" ${t.urgency === 'acil' ? 'selected' : ''}>Acil</option>
                  <option value="cok_acil" ${t.urgency === 'cok_acil' ? 'selected' : ''}>Çok Acil</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Sorun / İş Açıklaması</label>
              <textarea id="edit-t-desc" rows="3" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs">${t.description}</textarea>
            </div>

            ${isAdmin ? `
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 mb-0.5">İşlem Durumu (İstediğiniz Aşamaya Alın)</label>
                  <select id="edit-t-status" class="w-full rounded-xl border border-slate-300 px-2.5 py-2 text-xs bg-white font-semibold">
                    ${Object.keys(STATUS_LABELS).map(k => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${STATUS_LABELS[k].text}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Atanan Ekip</label>
                  <select id="edit-t-staff" class="w-full rounded-xl border border-slate-300 px-2.5 py-2 text-xs bg-white">
                    <option value="">Seçilmedi</option>
                    ${STAFF.map(s => `<option value="${s}" ${t.assignedStaff === s ? 'selected' : ''}>${s}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Net Fiyat Teklifi (KDV Hariç ₺)</label>
                  <input id="edit-t-net" type="number" value="${t.quote ? t.quote.netAmount : ''}" placeholder="Henüz girilmedi" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-bold" />
                </div>
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Teklif / Kapsam Notu</label>
                  <input id="edit-t-qnote" type="text" value="${t.quote ? (t.quote.note || '') : ''}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
                </div>
              </div>

              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Operasyon Bitiş Notu</label>
                <input id="edit-t-cnote" type="text" value="${t.completionNote || ''}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              </div>
            ` : ''}

            <div class="flex gap-2 pt-2">
              <button id="edit-t-save" class="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs">Değişiklikleri Kaydet</button>
              <button id="edit-t-delete" class="px-3.5 py-2.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-xs">İşi / Talebi Sil</button>
            </div>
          </div>`);

        document.getElementById('edit-t-close').addEventListener('click', closeModal);
        document.getElementById('edit-t-save').addEventListener('click', () => {
          t.category = document.getElementById('edit-t-cat').value;
          t.urgency = document.getElementById('edit-t-urg').value;
          t.description = document.getElementById('edit-t-desc').value.trim() || t.description;
          t.updatedAt = Date.now();
          t.aiEstimate = runAiCostEngine(t.category, t.description, t.urgency, db.customRates);

          if (isAdmin) {
            t.status = document.getElementById('edit-t-status').value;
            t.assignedStaff = document.getElementById('edit-t-staff').value || null;
            t.completionNote = document.getElementById('edit-t-cnote').value.trim();
            const netVal = Number(document.getElementById('edit-t-net').value) || 0;
            const qNote = document.getElementById('edit-t-qnote').value.trim();
            if (netVal > 0) {
              const totalVal = Math.round(netVal * 1.2);
              t.quote = { netAmount: netVal, vatRate: 20, totalAmount: totalVal, note: qNote, sentAt: (t.quote && t.quote.sentAt) || getNowStr() };
              if (t.invoice) {
                t.invoice.netAmount = netVal;
                t.invoice.vatAmount = totalVal - netVal;
                t.invoice.totalAmount = totalVal;
              }
            } else {
              t.quote = null;
            }
          }

          saveDb();
          closeModal();
          renderAll();
          publishTicketPacket(t);
          showToast('İş / talep bilgileri güncellendi!', 'success');
        });

        document.getElementById('edit-t-delete').addEventListener('click', () => {
          db.deletedIds = Array.from(new Set([...(db.deletedIds || []), ticketId]));
          broadcastTicketDelete(ticketId);
          db.tickets = db.tickets.filter(x => x.id !== ticketId);
          saveDb();
          closeModal();
          renderAll();
          showToast('Talep tamamen silindi.', 'info');
        });
      }

      function openAddClientModal() {
        openModal(`
          <div class="space-y-3">
            <h3 class="text-sm font-bold text-slate-900">Yeni Müşteri Ekle</h3>
            <input id="add-c-name" type="text" placeholder="İşletme Adı (Örn: Cadde Bistro)" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
            <div class="grid grid-cols-2 gap-2">
              <input id="add-c-user" type="text" placeholder="Kullanıcı Adı" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              <input id="add-c-pass" type="text" placeholder="Şifre" value="123456" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <select id="add-c-type" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs bg-white">
                <option value="Restoran">Restoran</option>
                <option value="Kafe">Kafe</option>
                <option value="Catering">Catering</option>
              </select>
              <input id="add-c-disc" type="number" min="0" max="50" value="0" placeholder="İndirim (%)" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
            </div>
            <input id="add-c-addr" type="text" placeholder="Adres" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
            <input id="add-c-phone" type="text" placeholder="Telefon" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
            <div class="grid grid-cols-2 gap-2">
              <input id="add-c-taxo" type="text" placeholder="Vergi Dairesi" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              <input id="add-c-taxn" type="text" placeholder="Vergi No" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
            </div>
            <div class="flex gap-2 pt-2">
              <button id="save-new-client" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">Kaydet</button>
              <button id="cancel-new-client" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">İptal</button>
            </div>
          </div>`);

        document.getElementById('cancel-new-client').addEventListener('click', closeModal);
        document.getElementById('save-new-client').addEventListener('click', () => {
          const name = document.getElementById('add-c-name').value.trim();
          const username = document.getElementById('add-c-user').value.trim().toLowerCase() || ('musteri_' + Date.now().toString().slice(-4));
          const password = document.getElementById('add-c-pass').value || '123456';
          if (!name) { showToast('İşletme adı girin.', 'warning'); return; }
          db.clients.push({
            id: 'c-' + Date.now(),
            username,
            password,
            name,
            type: document.getElementById('add-c-type').value,
            discount: Math.max(0, Math.min(50, Number(document.getElementById('add-c-disc').value) || 0)),
            address: document.getElementById('add-c-addr').value.trim() || 'İstanbul',
            phone: document.getElementById('add-c-phone').value.trim() || '+905XXXXXXXXX',
            taxOffice: document.getElementById('add-c-taxo').value.trim() || 'İstanbul V.D.',
            taxNo: document.getElementById('add-c-taxn').value.trim() || '0000000000',
            active: true
          });
          saveDb();
          closeModal();
          renderAll();
          publishClientPacket(db.clients[db.clients.length - 1]);
          showToast('Yeni müşteri eklendi!', 'success');
        });
      }

      function openEditClientModal(clientId) {
        const c = db.clients.find(x => x.id === clientId);
        if (!c) return;
        const isActive = c.active !== false;

        openModal(`
          <div class="space-y-3">
            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
              <h3 class="text-sm font-extrabold text-slate-900">⚙️ Müşteri Ayarları: ${c.name}</h3>
              <button id="edit-c-close" class="text-xs font-semibold text-slate-500">Kapat</button>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 mb-0.5">İşletme Adı</label>
              <input id="edit-c-name" type="text" value="${c.name}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Kullanıcı Adı</label>
                <input id="edit-c-user" type="text" value="${c.username}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              </div>
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Şifre</label>
                <input id="edit-c-pass" type="text" value="${c.password}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Tür</label>
                <select id="edit-c-type" class="w-full rounded-xl border border-slate-300 px-2 py-2 text-xs bg-white">
                  <option value="Restoran" ${c.type === 'Restoran' ? 'selected' : ''}>Restoran</option>
                  <option value="Kafe" ${c.type === 'Kafe' ? 'selected' : ''}>Kafe</option>
                  <option value="Catering" ${c.type === 'Catering' ? 'selected' : ''}>Catering</option>
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Özel İndirim (%)</label>
                <input id="edit-c-disc" type="number" min="0" max="50" value="${c.discount || 0}" class="w-full rounded-xl border border-slate-300 px-2.5 py-2 text-xs" />
              </div>
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Hesap Durumu</label>
                <select id="edit-c-active" class="w-full rounded-xl border border-slate-300 px-2 py-2 text-xs bg-white">
                  <option value="true" ${isActive ? 'selected' : ''}>Aktif</option>
                  <option value="false" ${!isActive ? 'selected' : ''}>Askıda (Giriş Kapalı)</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Telefon</label>
              <input id="edit-c-phone" type="text" value="${c.phone}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Adres</label>
              <input id="edit-c-addr" type="text" value="${c.address}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Vergi Dairesi</label>
                <input id="edit-c-taxo" type="text" value="${c.taxOffice}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              </div>
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Vergi No</label>
                <input id="edit-c-taxn" type="text" value="${c.taxNo}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              </div>
            </div>
            <div class="flex gap-2 pt-2">
              <button id="edit-c-save" class="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs">Ayarları Kaydet</button>
              <button id="edit-c-delete" class="px-3.5 py-2.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-xs">Müşteriyi Sil</button>
            </div>
          </div>`);

        document.getElementById('edit-c-close').addEventListener('click', closeModal);
        document.getElementById('edit-c-save').addEventListener('click', () => {
          c.name = document.getElementById('edit-c-name').value.trim() || c.name;
          c.username = document.getElementById('edit-c-user').value.trim().toLowerCase() || c.username;
          c.password = document.getElementById('edit-c-pass').value || c.password;
          c.type = document.getElementById('edit-c-type').value;
          c.discount = Math.max(0, Math.min(50, Number(document.getElementById('edit-c-disc').value) || 0));
          c.active = document.getElementById('edit-c-active').value === 'true';
          c.phone = document.getElementById('edit-c-phone').value.trim();
          c.address = document.getElementById('edit-c-addr').value.trim();
          c.taxOffice = document.getElementById('edit-c-taxo').value.trim();
          c.taxNo = document.getElementById('edit-c-taxn').value.trim();
          saveDb();
          closeModal();
          renderAll();
          publishClientPacket(c);
          showToast('Müşteri ayarları güncellendi!', 'success');
        });
        document.getElementById('edit-c-delete').addEventListener('click', () => {
          db.clients = db.clients.filter(x => x.id !== clientId);
          broadcastClientDelete(clientId);
          if (ui.activeClientId === clientId) {
            ui.activeClientId = null;
            saveUi();
          }
          saveDb();
          closeModal();
          renderAll();
          showToast('Müşteri silindi.', 'info');
        });
      }

      function openInstallModal() {
        openModal(`
          <div class="space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 pb-2.5">
              <h3 class="text-sm font-extrabold text-slate-900">📲 Her Telefona Uygulama Kurulumu</h3>
              <button id="close-install-modal" class="text-xs font-semibold text-slate-500">Kapat</button>
            </div>
            <p class="text-xs text-slate-600">Bu uygulama PWA (Progressive Web App) uyumludur. App Store veya Google Play gerektirmeden tüm iPhone ve Android telefonlara ana ekran uygulaması olarak kurulur.</p>

            ${deferredInstallPrompt ? `
              <button id="trigger-native-pwa" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs shadow">
                ⚡ Şimdi Bu Cihaza Yükle
              </button>
            ` : ''}

            <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 space-y-1.5 text-xs">
              <div class="font-bold text-slate-900">🍎 iPhone / iPad (Safari)</div>
              <p class="text-slate-600 text-[11px]">1. Bağlantıyı <strong>Safari</strong> ile açın.<br/>2. Alt menüdeki <strong>Paylaş (⬆️)</strong> simgesine dokunun.<br/>3. <strong>"Ana Ekrana Ekle"</strong> seçeneğine basın.</p>
            </div>

            <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 space-y-1.5 text-xs">
              <div class="font-bold text-slate-900">🤖 Android (Chrome)</div>
              <p class="text-slate-600 text-[11px]">1. Bağlantıyı <strong>Chrome</strong> ile açın.<br/>2. Sağ üstteki <strong>Menü (⋮)</strong> simgesine dokunun.<br/>3. <strong>"Uygulamayı Yükle"</strong> veya <strong>"Ana Ekrana Ekle"</strong>ye basın.</p>
            </div>

            <div class="bg-amber-50 rounded-xl p-3 border border-amber-200 text-[11px] text-amber-900">
              <strong>Ayrı Kurulum:</strong> ZIP paketindeki <code>musteri-app</code> klasörünü müşterilerinize, <code>yonetici-app</code> klasörünü sadece kendi telefonunuza kurabilirsiniz. Çoklu telefon senkronizasyonu için <strong>AI &amp; Bulut</strong> sekmesinden Firebase URL'si bağlayabilirsiniz.
            </div>
          </div>`);

        document.getElementById('close-install-modal').addEventListener('click', closeModal);
        const nativeBtn = document.getElementById('trigger-native-pwa');
        if (nativeBtn) {
          nativeBtn.addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;
            deferredInstallPrompt.prompt();
            await deferredInstallPrompt.userChoice;
            deferredInstallPrompt = null;
            closeModal();
          });
        }
      }

      // ==================== GLOBAL EVENT LISTENERS ====================
      document.getElementById('mode-btn-customer').addEventListener('click', () => { ui.mode = 'customer'; saveUi(); updateModeUI(); renderCustomerApp(); });
      document.getElementById('mode-btn-admin').addEventListener('click', () => { ui.mode = 'admin'; saveUi(); updateModeUI(); renderAdminApp(); });
      document.getElementById('mode-btn-split').addEventListener('click', () => { ui.mode = 'split'; saveUi(); updateModeUI(); renderAll(); });

      document.getElementById('btn-install-guide').addEventListener('click', openInstallModal);
      document.getElementById('cust-ping-btn').addEventListener('click', sendPingTest);
      document.getElementById('admin-ping-btn').addEventListener('click', sendPingTest);
      document.getElementById('cust-install-btn').addEventListener('click', openInstallModal);
      document.getElementById('admin-install-btn').addEventListener('click', openInstallModal);

      document.querySelectorAll('.cust-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          ui.custTab = btn.dataset.custTab;
          saveUi();
          renderCustomerApp();
        });
      });

      document.querySelectorAll('.admin-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          ui.adminTab = btn.dataset.adminTab;
          saveUi();
          renderAdminApp();
        });
      });

      document.getElementById('cust-notif-btn').addEventListener('click', () => {
        const list = ui.activeClientId ? db.notifications.filter(n => n.clientId === ui.activeClientId) : [];
        list.forEach(n => n.read = true);
        saveDb(false);
        renderCustomerApp();
        openModal(`
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold text-slate-900">Bildirimler</h3>
              <button id="close-notif-modal" class="text-xs font-semibold text-slate-500">Kapat</button>
            </div>
            ${list.length === 0 ? '<div class="text-xs text-slate-500 py-4 text-center">Yeni bildiriminiz yok.</div>' : list.map(n => `
              <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                <div class="font-medium text-slate-800">${n.text}</div>
                <div class="text-[10px] text-slate-400 mt-1">${n.time}</div>
              </div>`).join('')}
          </div>`);
        document.getElementById('close-notif-modal').addEventListener('click', closeModal);
      });

      document.getElementById('btn-reset-demo').addEventListener('click', () => {
        db = createInitialSharedDb();
        ui.activeClientId = null;
        ui.authView = 'login';
        saveUi();
        saveDb();
        renderAll();
        showToast('Demo verileri başlangıç durumuna döndürüldü.', 'info');
      });

      function renderAll() {
        updateModeUI();
        renderCustomerApp();
        renderAdminApp();
      }

      renderAll();
    })();
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body>
</html>
